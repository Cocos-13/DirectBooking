<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Final Black</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Onest:wght@600;700;800&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
    Toggle theme
  </button>

  <div class="rating-block">
    <div class="canvas-row">
      <canvas id="ratingCanvas" role="img" aria-label="4.96" class="rating-canvas"></canvas>
    </div>
    <p class="superhost">Superhost</p>
    <p class="rating-count">23 reviews</p>
  </div>

  <div class="controls">
    <label>
      pitch
      <input id="pitchInput" type="range" min="2" max="12" step="0.5" value="6" />
      <span id="pitchVal">6</span>
    </label>
    <label>
      spray
      <input id="sprayInput" type="range" min="0" max="10" step="0.5" value="4" />
      <span id="sprayVal">4</span>
    </label>
    <label>
      fontSizePx
      <input id="fontSizeInput" type="range" min="80" max="360" step="4" value="240" />
      <span id="fontSizeVal">240</span>
    </label>
  </div>

  <script src="script.js"></script>
</body>
</html>
